# publish-kit 配置文件
#
# 用法：node bin/init.cjs 会问几个问题并生成 config.yaml（推荐），
#       或复制本文件为 config.yaml 手填。
#
# 本文件是模板，不含个人信息，可安全入库；config.yaml 含你的偏好与凭证，已进 .gitignore。
#
# ─────────────────────────────────────────────────────────────
# 关于留空的统一约定
#
#   所有平台字段（分区/分类/合集…）留空 = 脚本不碰这个字段，
#   并在控制台明确告警提示你手动填。
#
#   脚本永远不会猜一个默认值替你填上——猜错的值会静默落到发布页上，
#   比留空更糟：留空你能一眼看见告警，猜错你可能发现得晚。
# ─────────────────────────────────────────────────────────────

runtime:
  # ── 运行通道（2026-10-27 起）────────────────────────────────────
  # playwright（默认）：patchright 经 CDP 连外部 Chrome（下面 cdp_url/profile_dir 生效）。
  # ego：脚本经 bin/ego-run.ps1 跑在 ego lite（ego-browser）运行时里。
  #   ⚠️ ego 模式下 cdp_url / chrome_path / profile_dir **全部不生效**——
  #      登录态在 ego lite 自己的 profile 里（用户在 ego lite 窗口登录）。
  #   ⚠️ 编排器（bin/publish-all.cjs）在 ego 模式下会把浏览器槽位改经 ego-run.ps1 启动，
  #      并把最后一条命令注入 --handoff 1（交还用户点发布）。
  driver: "playwright"

  # TaskSpace 空间名前缀（**只对 ego 通道生效**）。
  # ⚠️ TaskSpace 空间名在 ego 应用里**全局唯一**——本仓库用 pk，
  #    与 operation 工作区的 op 前缀隔离，两边才能同时并行发布。
  space_prefix: "pk"

  # CDP 调试端口（playwright 通道）。
  # 注意：Windows 上靠近动态端口段的固定端口可能被系统保留导致起不来，
  #      换端口前先跑 `netsh interface ipv4 show excludedportrange protocol=tcp` 查一下。
  cdp_url: "http://127.0.0.1:39223"

  # Chrome 可执行文件路径。留空则 doctor 自动探测常见安装位置。
  chrome_path: ""

  # 专用浏览器 profile 目录，登录态全存在这里。
  # 必须用独立目录：Chrome 136+ 禁止在默认用户数据目录上开 CDP 端口。
  # 目录一旦定下就别移动，登录态会一直复用。
  profile_dir: "~/.publish-profile"

content:
  # 你的内容领域（AI 科技 / 财经 / 美食…）。init 会问这一项，
  # 各平台的分区/分类默认值由它推导，可在下面逐平台覆盖。
  domain: ""

  # 界面语言。注意：各平台选择器是按中文界面写的，切成 en 跑不通。
  language: zh

publish:
  # 「含 AI 生成内容」声明。多数平台已强制要求，默认开。
  declare_ai: true

  # 每步截图留档目录，便于回溯填单结果
  screenshot_dir: "./screenshots"

  # 每平台运行日志目录（带时间戳每一步 + 收尾的步骤耗时倒序表 + 告警汇总）。
  # 用途：慢在哪不该靠猜。
  log_dir: "./logs"

  # 发布台账（**可选**）。配了 = 启用「防重复发布」闸门 + 跑完写回记录；
  # **不配 = 零行为变化**（不创建任何文件，现有用法完全不受影响）。
  #
  # 为什么需要：页面态护栏只挡得住「同一个标签页还没关」；台账挡的是**跨进程、跨期**的重复
  #   ——昨天发过、已填完交给你还没点发布、上次失败重跑。
  # 用法：node bin/publish-all.cjs --content-key "2026-10-21_xxx#video" ...
  # ledger: "./publish-ledger.yaml"

platforms:
  # ── 视频线 ──────────────────────────────────────────────
  bilibili:
    enabled: true
    # 分区名，如「人工智能」。留空 = 不碰分区，保留平台系统推荐 + 控制台告警
    category_hint: ""

  weibo:
    enabled: true
    # 分类频道名，如「科技数码」。留空 = 不填
    channel_hint: ""

  zhihu:
    enabled: true
    # 所属领域，如「科技互联网」。留空 = 不填
    field_hint: ""

  douyin:
    enabled: true
    # 合集名，如「每日新闻」。留空 = 不选择合集
    album: ""
    # 自主声明「内容由AI生成」
    self_declare: true
    # 图文线配乐：值 = 收藏配乐里的曲名（如 "Opus 37"）。留空 = 不碰配乐 + 告警，**绝不猜**。
    #   只有图文线有配乐入口（视频线是视频自带音轨）。
    music: ""

  shipinhao:
    enabled: false
    # 合集名，留空 = 不选
    album: ""
    # 是否自动设为「不显示位置」。默认 false —— 这是替你点掉一个你没说过的选择，
    # 不该默认开。init 会问这一项。
    hide_location: false

  # ── 图文线 ──────────────────────────────────────────────
  wechat:
    enabled: true
    # 公众号贴图走官方 API（不走浏览器），需要你自己的 AppID / AppSecret
    # 获取：mp.weixin.qq.com → 设置与开发 → 基本配置
    app_id: ""
    app_secret: ""
    # newspic 单条图片数上限（微信侧限制）
    max_images: 20
